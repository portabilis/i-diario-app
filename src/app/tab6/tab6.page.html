<ion-header>
  <ion-toolbar mode="md">
    <ion-title>Avaliações</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="doRefresh()">
        <ion-icon slot="icon-only" name="sync"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <div *ngIf="dailyNotes.length === 0" class="empty-results">
    <p>Nenhuma avaliação foi encontrada.</p>
  </div>

  <div *ngFor="let dailyNote of dailyNotes">
    <h3 class="date-header">{{ dailyNote.record_date }}</h3>
    <ion-accordion-group>
      <ion-accordion *ngFor="let item of dailyNote.unities" class="panel">
        <ion-item slot="header">
          <ion-label>{{ item.unity.description }}</ion-label>
        </ion-item>
        <div slot="content">
          <ion-item
            *ngFor="let dailyNote of item.diaries"
            (click)="openDailyNoteForm(dailyNote.id)"
            button
          >
            <ion-label>
              <h3>{{ dailyNote.discipline_name }} - {{ dailyNote.classroom_name }}</h3>
              <p>{{ dailyNote.description }}</p>
            </ion-label>
            <ion-icon
              slot="end"
              [name]="getSyncIcon(dailyNote.synced)"
              [color]="getSyncColor(dailyNote.synced)"
            ></ion-icon>
          </ion-item>
        </div>
      </ion-accordion>
    </ion-accordion-group>
  </div>

</ion-content>
